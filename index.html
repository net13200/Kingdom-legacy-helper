<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kingdom Ledger</title>
<meta name="description" content="Bookkeeping companion for Kingdom Legacy: Feudal Kingdom. Resources, turns, deck and rounds. Part of SugiGames." />
<meta name="theme-color" content="#16131d" />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="Kingdom Ledger" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
<script>
  // Apply the saved theme before first paint so the intro matches it.
  try { if (localStorage.getItem("kingdom-ledger/theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
</script>
</head>
<body>

<!-- SugiGames intro: the 杉 (cedar) kanji painted stroke by stroke. Tap to skip. -->
<div id="splash" role="status" aria-label="Kingdom Ledger is loading">
  <svg id="kanji-svg" viewBox="0 0 100 100" width="150" height="150" aria-hidden="true">
    <defs>
      <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#b07a50" />
        <stop offset="100%" stop-color="#7c4e30" />
      </linearGradient>
      <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8de89c" />
        <stop offset="100%" stop-color="#2fae64" />
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#trunkGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path class="kanji-stroke" d="M 14 34 C 24 33, 36 33.5, 46 34.5" />
      <path class="kanji-stroke" d="M 30 12 C 29.5 32, 30 55, 30 88" />
      <path class="kanji-stroke" d="M 30 42 C 25 50, 20 58, 16 66" />
      <path class="kanji-stroke" d="M 30 42 C 35 50, 40 58, 44 66" />
    </g>
    <g fill="none" stroke="url(#leafGradient)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path class="kanji-stroke" d="M 76 14 C 68 20, 62 26, 58 32" />
      <path class="kanji-stroke" d="M 86 40 C 76 47, 68 54, 62 60" />
      <path class="kanji-stroke" d="M 96 68 C 84 76, 74 82, 66 90" />
    </g>
    <circle id="brush-tip" r="4.2" fill="#ffffff" opacity="0" />
  </svg>
  <div id="splash-word">
    <span class="splash-brand"><span class="word-sugi">Sugi</span><span class="word-games">Games</span></span>
    <span class="splash-app">Kingdom Ledger</span>
  </div>
</div>

<div id="root"></div>
<script src="./splash.js"></script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
